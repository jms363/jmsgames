<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JMS Studios — Play our web games</title>
    <meta
      name="description"
      content="JMS Studios is the home of our web games. Browse and play the collection — free, in your browser, no download."
    />
    <meta name="theme-color" content="#0a0a12" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JMS Studios" />
    <meta property="og:description" content="Free web games, playable in your browser. No download." />
    <meta property="og:url" content="https://jmsgames.com" />
    <meta property="og:image" content="https://jmsgames.com/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://jmsgames.com/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles.css" />

    <!-- Google Analytics 4 (GA4) — JMS Studios account, jmsgames.com property -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0Q1CEDQWTR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0Q1CEDQWTR');
    </script>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">JMS</span>
        <span class="brand-word">STUDIOS</span>
      </a>
      <p class="tagline">Free web games. No download. Just press start.</p>
    </header>

    <main>
      <section class="hero">
        <h1>
          <span class="hero-line-1">PICK A GAME.</span>
          <span class="hero-line-2">PLAY NOW.</span>
        </h1>
        <p class="hero-sub">
          A growing arcade of browser games from JMS Studios. Click any cabinet to play.
        </p>
      </section>

      <section class="grid-wrap" aria-label="Games">
        <div id="games" class="grid">
          <!-- Cards injected by app.js from games.json -->
        </div>
        <noscript>
          <p class="noscript">
            Enable JavaScript to load the game list — or jump straight to
            <a href="https://drugbiz.jmsgames.com">Drug BiZ</a>.
          </p>
        </noscript>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> JMS Studios · <a href="https://jmsgames.com">jmsgames.com</a></p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>

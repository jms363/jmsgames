<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — JMS Studios</title>
    <meta name="theme-color" content="#0a0a12" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .center-404 {
        max-width: 600px;
        margin: 0 auto;
        padding: 120px 24px;
        text-align: center;
      }
      .center-404 h1 {
        font-family: "Press Start 2P", monospace;
        font-size: clamp(40px, 12vw, 90px);
        color: var(--neon-3);
        text-shadow: 0 0 18px rgba(244, 114, 182, 0.6);
        margin: 0;
      }
      .center-404 p {
        color: var(--text-dim);
        font-size: 17px;
        margin: 18px 0 28px;
      }
      .back-btn {
        font-family: "Press Start 2P", monospace;
        font-size: 12px;
        color: #05140a;
        background: #39ff14;
        text-decoration: none;
        padding: 14px 20px;
        border-radius: 8px;
        box-shadow: 0 0 16px rgba(57, 255, 20, 0.5);
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="center-404">
      <h1>404</h1>
      <p>Game over — this screen doesn't exist.</p>
      <a class="back-btn" href="/">&larr; Back to the arcade</a>
    </div>
  </body>
</html>
